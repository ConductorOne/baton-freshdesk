name: ci
on: pull_request
jobs:
  go-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Run linters
        uses: golangci/golangci-lint-action@v8
        with:
          version: latest
          args: --timeout=3m
  go-test:
    strategy:
      matrix:
        platform: [ubuntu-latest]
    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout code
        if: success()
        uses: actions/checkout@v4
      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: go tests
        run: (set -o pipefail && go test -v -covermode=count -json ./... | tee test.json)
      - name: annotate go tests
        if: always()
        uses: guyarb/golang-test-annotations@v0.5.1
        with:
          test-results: test.json

  freshdesk-tests:
    runs-on: ubuntu-latest
    env:
      BATON_LOG_LEVEL: debug
      BATON_API_KEY: ${{ secrets.FRESHDESK_TOKEN }}
      BATON_DOMAIN: ${{ secrets.FRESHDESK_DOMAIN }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build baton-freshdesk
        run: go build ./cmd/baton-freshdesk
      - name: Test sync
        uses: ConductorOne/github-workflows/actions/sync-test@v2
        with:
          connector: ./baton-freshdesk
          baton-entitlement: ${{ vars.CONNECTOR_ENTITLEMENT }}
          baton-principal: ${{ vars.CONNECTOR_PRINCIPAL }}
          baton-principal-type: ${{ vars.CONNECTOR_PRINCIPAL_TYPE }}
