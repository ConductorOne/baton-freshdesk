name: ci
on: pull_request
jobs:
  freshdesk-tests:
    runs-on: ubuntu-latest
    env:
      BATON_LOG_LEVEL: debug
      BATON_FRESHDESK_API_KEY: ${{ secrets.FRESHDESK_TOKEN }}
      BATON_FRESHDESK_DOMAIN: ${{ secrets.FRESHDESK_DOMAIN }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build baton-freshdesk
        run: go build ./cmd/baton-freshdesk
      - name: Test sync
        uses: ConductorOne/github-workflows/actions/sync-test@v4
        with:
          connector: ./baton-freshdesk
          baton-entitlement: ${{ vars.CONNECTOR_ENTITLEMENT }}
          baton-principal: ${{ vars.CONNECTOR_PRINCIPAL }}
          baton-principal-type: ${{ vars.CONNECTOR_PRINCIPAL_TYPE }}
